<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/soldesoter_logo.png">
<title>Projetos · Sól de Sóter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;600;700;800&family=Josefin+Sans:wght@400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
<style>
/* ===========================================================
   RUBRICA — mesa de escrita do Sól de Sóter
   tokens herdados de css/design-system.css
   =========================================================== */
:root{
  --bg:#0d0d12;
  --bg2:#13131c;
  --bg3:#1a1a27;
  --card:#16161f;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --text:#e8e4f0;
  --muted:#7a7590;
  --accent1:#c8a96e;
  --accent2:#7c6fcd;
  --accent3:#5ec4a8;
  --accent4:#e06b8b;
  --accent5:#e8864a;
  --accent6:#4ab0e8;
  --font-display:"Playfair Display",Georgia,serif;
  --font-editorial:"Cormorant Garamond",Georgia,serif;
  --font-ui:"Syne",system-ui,sans-serif;
  --font-label:"Josefin Sans",system-ui,sans-serif;
  --font-mono:"DM Mono","Courier New",monospace;
  --radius:16px;
  --side-w:264px;
}
*{box-sizing:border-box}
html{height:100%;scrollbar-width:thin;scrollbar-color:rgba(200,169,110,.18) rgba(255,255,255,.02)}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(214,183,120,.6),rgba(200,169,110,.32));
  border-radius:999px;border:2px solid rgba(10,9,24,.88);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;color:inherit}
::selection{background:rgba(200,169,110,.28)}
:focus-visible{outline:1px solid var(--accent1);outline-offset:2px;border-radius:4px}
[contenteditable]{outline:none}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
#app{position:relative;z-index:1;display:flex;height:calc(100vh - 58px);margin-top:58px}

/* ---------------- área de trabalho ---------------- */
.side{
  width:var(--side-w);flex:0 0 var(--side-w);overflow:hidden;
  background:rgba(19,19,28,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--border);display:flex;flex-direction:column;user-select:none;
  transition:width .2s ease,flex-basis .2s ease,opacity .15s ease,border-color .2s ease;
}
body.side-collapsed .side{width:0;min-width:0;flex:0 0 0;opacity:0;pointer-events:none;border-right-color:transparent}
.ws{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--border)}
.ws .mark{
  font-family:var(--font-display);font-size:19px;color:var(--accent1);letter-spacing:.5px;
}
.ws .mark em{font-style:italic}
.ws .sp{flex:1}
.sbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 18px;
  font-family:var(--font-ui);font-size:12.5px;font-weight:600;letter-spacing:.3px;
  color:var(--muted);text-align:left;transition:color .18s;position:relative;
}
.sbtn:hover{color:var(--text)}
.sbtn .ic{width:16px;text-align:center;flex:0 0 16px;font-size:13px}
.sbtn .kbd{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;opacity:.55}
.sbtn.on{color:var(--accent1)}

.sec{
  display:flex;align-items:center;gap:8px;padding:20px 18px 8px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--accent1);opacity:.8;
}
.sec .sp{flex:1}
.sec button{color:var(--muted);font-size:12px;padding:2px 5px;border-radius:5px;font-family:var(--font-mono)}
.sec button:hover{color:var(--accent1);background:rgba(200,169,110,.08)}

.tree{flex:1;overflow-y:auto;padding:0 8px 20px}
.row{
  display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;cursor:pointer;
  color:var(--muted);font-size:13.5px;position:relative;transition:background .16s,color .16s;
}
.row:hover{background:rgba(255,255,255,.04);color:var(--text)}
.row.on{background:rgba(200,169,110,.1);color:var(--accent1)}
.row.on::before{content:'';position:absolute;left:-8px;top:6px;bottom:6px;width:2px;background:var(--accent1);border-radius:0 2px 2px 0}
.tw{
  width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;border-radius:4px;
  font-size:8px;color:var(--muted);transition:transform .16s,color .16s;
}
.tw:hover{color:var(--accent1);background:rgba(255,255,255,.06)}
.tw.open{transform:rotate(90deg);color:var(--accent1)}
.tw.leaf{opacity:.18}
.row .em{width:19px;flex:0 0 19px;text-align:center;font-size:14px}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-family:var(--font-mono);font-size:9.5px;opacity:.45}
.row .add{opacity:0;font-size:14px;color:var(--muted);padding:0 3px;border-radius:4px}
.row:hover .add{opacity:.8}
.row .add:hover{color:var(--accent1)}
.row .add[data-trashrow]{font-size:12px}
.row .add[data-trashrow]:hover{color:var(--accent4)}
.kids{display:none}
.kids.open{display:block}
.foot{padding:8px 0 16px;border-top:1px solid var(--border)}

/* ---------------- topo ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:6px;padding:0 24px;
  background:rgba(6,5,16,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}
.crumb{display:flex;align-items:center;gap:2px;overflow:hidden}
.crumb button{
  padding:4px 9px;border-radius:6px;white-space:nowrap;font-size:12.5px;font-weight:600;
  color:var(--muted);letter-spacing:.3px;position:relative;transition:color .2s;
}
.crumb button::after{
  content:'';position:absolute;bottom:1px;left:9px;right:9px;height:1.5px;background:var(--accent1);
  transform:scaleX(0);transform-origin:left;transition:transform .25s cubic-bezier(.22,1,.36,1);border-radius:2px;
}
.crumb button:hover{color:var(--text)}
.crumb button:hover::after{transform:scaleX(1)}
.crumb button:last-child{color:var(--accent1)}
.crumb i{color:var(--muted);font-style:normal;opacity:.45;font-size:11px}
.top .sp{flex:1}
.tbtn{
  padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--muted);border:1px solid transparent;transition:all .25s;
  font-family:var(--font-ui);
}
.tbtn:hover{color:var(--accent1);border-color:rgba(200,169,110,.35);background:rgba(200,169,110,.07)}
.tbtn.icon{padding:6px 10px;font-size:13px;letter-spacing:0}

/* ---------------- superfície de página ---------------- */
.scroll{
  flex:1;overflow-y:auto;position:relative;
  background:linear-gradient(180deg,rgba(13,13,18,.5),rgba(13,13,18,.82));
}
.surface{position:relative}
.cover{height:186px;position:relative;border-bottom:1px solid var(--border)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(13,13,18,.72))}
.cover .swap{
  position:absolute;right:20px;bottom:14px;z-index:2;background:rgba(6,5,16,.7);
  border:1px solid var(--border-2);padding:5px 12px;border-radius:999px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--muted);opacity:0;transition:opacity .2s;
}
.cover:hover .swap{opacity:1}
.cover .swap:hover{color:var(--accent1);border-color:rgba(200,169,110,.4)}

.page{max-width:var(--page-w,760px);margin:0 auto;padding:0 56px 40vh;position:relative}
.page.wide{max-width:90%;padding-left:76px;padding-right:76px}
.pico{
  font-size:56px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;
  width:78px;height:78px;border-radius:20px;background:rgba(19,19,28,.86);
  border:1px solid var(--border-2);box-shadow:0 14px 40px rgba(0,0,0,.55);
  margin-bottom:10px;transition:transform .2s,border-color .2s;
}
.pico:hover{transform:translateY(-2px);border-color:rgba(200,169,110,.45)}
.has-cover .pico{margin-top:-46px;position:relative;z-index:3}
.ptitle{
  font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1.12;
  letter-spacing:-.6px;color:#f0eaff;margin:0;padding:2px 0;
  text-shadow:0 0 60px rgba(124,111,205,.28);
}
.ptitle:empty::before{content:attr(data-ph);color:var(--muted);opacity:.5}
.ptools{display:flex;gap:6px;margin:12px 0 2px;opacity:0;transition:opacity .2s}
.surface:hover .ptools{opacity:1}
.ptools button{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--border);
}
.ptools button:hover{color:var(--accent1);border-color:rgba(200,169,110,.35)}

.props{margin:14px 0 6px;border-left:1px solid var(--border);padding-left:14px}
.prow{display:flex;align-items:flex-start;gap:8px;padding:2px 0;border-radius:8px}
.prow:hover{background:rgba(255,255,255,.025)}
.pkey{
  width:168px;flex:0 0 168px;display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);padding:7px 8px;border-radius:6px;
}
.pkey:hover{color:var(--accent1)}
.pkey .ic{opacity:.55}
.pval{flex:1;min-width:0;padding:6px 10px;border-radius:6px;font-size:14px;cursor:text;color:var(--text)}
.pval:empty::before{content:'vazio';color:var(--muted);opacity:.45;font-family:var(--font-mono);font-size:11px}
.pval:hover{background:rgba(255,255,255,.04)}
.pill{
  display:inline-block;padding:3px 12px;border-radius:999px;font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  border:1px solid currentColor;
}
.addprop{
  display:flex;align-items:center;gap:8px;color:var(--muted);opacity:.6;padding:7px 8px;border-radius:6px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
}
.addprop:hover{opacity:1;color:var(--accent1)}

/* ---------------- blocos ---------------- */
.blocks{padding-top:14px}
.blk{position:relative;display:flex;align-items:flex-start;padding:var(--blk-gap,2px) 0}
.blk .gut{position:absolute;left:-48px;top:2px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.blk:hover .gut{opacity:1}
.gut button{width:21px;height:24px;border-radius:6px;color:var(--muted);display:grid;place-items:center;font-size:13px}
.gut button:hover{background:rgba(255,255,255,.06);color:var(--accent1)}
.gut .drag{cursor:grab}
.marker{flex:0 0 auto;user-select:none;display:flex;align-items:flex-start;color:var(--accent1)}
.ct{
  flex:1;min-width:0;padding:3px 2px;white-space:pre-wrap;word-break:break-word;
  font-family:var(--ct-font,var(--font-editorial));font-size:var(--ct-size,20px);
  line-height:var(--ct-lh,1.68);color:var(--text);
}
.blk[data-t="p"] .ct{text-indent:var(--ct-indent,0)}
.surface.locked .gut,.surface.locked .addprop,.surface.locked .ptools{display:none}
.surface.locked .ct,.surface.locked .pval,.surface.locked [data-title]{cursor:default}
.lockbadge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:4px 12px;border-radius:999px;
  border:1px solid rgba(200,169,110,.3);background:rgba(200,169,110,.08);color:var(--accent1);
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
}
.ct:empty::before{content:attr(data-ph);color:var(--muted);opacity:.45;font-family:var(--font-mono);font-size:12px}

.blk[data-t="h1"] .ct,.blk[data-t="h2"] .ct,.blk[data-t="h3"] .ct{
  font-family:var(--font-display);font-weight:700;line-height:1.25;color:#f0eaff;
}
.blk[data-t="h1"] .ct{font-size:32px;padding-top:26px}
.blk[data-t="h2"] .ct{font-size:25px;padding-top:20px}
.blk[data-t="h3"] .ct{font-size:20px;padding-top:14px;font-weight:400;font-style:italic;color:var(--accent1)}
.blk[data-t="quote"]{border-left:2px solid var(--accent1);padding-left:18px;margin:8px 0}
.blk[data-t="quote"] .ct{font-style:italic;color:#d8d2e8}
.blk[data-t="code"]{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:8px 0}
.blk[data-t="code"] .ct{font-family:var(--font-mono);font-size:13px;line-height:1.7;color:var(--accent3)}
.blk[data-t="callout"]{
  background:rgba(124,111,205,.09);border:1px solid rgba(124,111,205,.24);
  border-radius:var(--radius);padding:16px 18px;margin:10px 0;gap:12px;
}
.blk[data-t="callout"] .ct{font-size:18px}
.blk[data-t="divider"]{padding:14px 0}
.blk[data-t="divider"] hr{width:100%;border:none;height:1px;margin:0;
  background:linear-gradient(90deg,transparent,rgba(200,169,110,.5),transparent)}
.blk[data-t="bullet"] .marker,.blk[data-t="num"] .marker,.blk[data-t="todo"] .marker{
  width:26px;justify-content:center;padding-top:6px;font-size:14px;
}
.blk[data-t="num"] .marker{font-family:var(--font-mono);font-size:12px}
.blk[data-t="todo"] .marker{cursor:pointer;font-size:15px}
.blk[data-t="todo"].done .ct{color:var(--muted);text-decoration:line-through}
.blk[data-t="page"] .pagelink{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;flex:1;cursor:pointer;
  border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:14px;font-weight:600;
  transition:border-color .2s,background .2s;
}
.blk[data-t="page"] .pagelink:hover{border-color:rgba(200,169,110,.4);background:rgba(200,169,110,.06)}
.blk.drop-target{box-shadow:0 2px 0 var(--accent1)}

.md-b{font-weight:600;color:#f2edff}
.md-i{font-style:italic}
.md-c{font-family:var(--font-mono);font-size:.72em;background:rgba(94,196,168,.12);color:var(--accent3);padding:2px 6px;border-radius:5px}
.md-s{text-decoration:line-through;opacity:.6}
.wl{color:var(--accent1);border-bottom:1px solid rgba(200,169,110,.35);cursor:pointer;padding:0 1px;transition:background .18s}
.wl:hover{background:rgba(200,169,110,.14)}
.wl.miss{color:var(--muted);border-bottom-style:dashed}
.tg{color:var(--accent2);cursor:pointer;font-family:var(--font-mono);font-size:.7em;letter-spacing:.5px}

/* ---------------- vistas ---------------- */
.dbwrap{width:100%;margin:10px 0}
.dbtabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:12px;padding-bottom:6px}
.dbtabs button{
  padding:5px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
}
.dbtabs button:hover{color:var(--text)}
.dbtabs button.on{color:var(--accent1);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:400;
}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--muted)}
tr:hover td{background:rgba(255,255,255,.02)}
td.nm{color:var(--text);cursor:pointer;font-size:14px}
td.nm:hover{color:var(--accent1)}
/* galeria */
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gal.p{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.gal.g{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.gcard{
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);
  cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .22s,transform .22s,box-shadow .22s;
}
.gcard:hover{
  border-color:rgba(200,169,110,.42);transform:translateY(-3px);
  box-shadow:0 14px 34px rgba(0,0,0,.45);
}
.gcap{height:88px;position:relative;flex:0 0 88px}
.gal.p .gcap{height:62px;flex-basis:62px}
.gal.g .gcap{height:116px;flex-basis:116px}
.gcap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(13,13,18,.5))}
.gico{
  position:absolute;left:12px;bottom:-15px;z-index:2;width:34px;height:34px;border-radius:10px;
  background:rgba(19,19,28,.94);border:1px solid var(--border-2);display:grid;place-items:center;font-size:17px;
}
.gbody{padding:22px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard b{
  font-family:var(--font-display);font-size:14.5px;font-weight:700;line-height:1.25;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.gal.g .gcard b{font-size:17px}
.gcard p{
  margin:0;font-family:var(--font-editorial);font-size:14px;line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.gmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:auto;padding-top:8px}
.gmeta .pill{font-size:9px;padding:2px 8px}
.gw{font-family:var(--font-mono);font-size:9px;color:var(--muted);opacity:.55;letter-spacing:.5px}
.gcard.gnew{
  border-style:dashed;background:none;align-items:center;justify-content:center;gap:7px;
  min-height:150px;color:var(--muted);font-family:var(--font-mono);font-size:10px;
  letter-spacing:1.4px;text-transform:uppercase;
}
.gal.p .gcard.gnew{min-height:112px}
.gcard.gnew span{font-size:21px;line-height:1}
.gcard.gnew:hover{color:var(--accent1);border-color:rgba(200,169,110,.45);transform:none;box-shadow:none}
.gcard.dragging{opacity:.4}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 236px}
.col h5{
  margin:0 0 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);display:flex;gap:8px;font-weight:400;
}
.col .drop{min-height:64px;padding:3px;border-radius:12px;transition:background .18s}
.col .drop.over{background:rgba(200,169,110,.07);box-shadow:inset 0 0 0 1px rgba(200,169,110,.3)}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;
  margin-bottom:8px;cursor:pointer;transition:border-color .2s,transform .2s;
}
.card:hover{border-color:rgba(200,169,110,.35);transform:translateY(-1px)}
.card b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.card small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}

/* ---------------- retrolinks ---------------- */
.backl{max-width:var(--page-w,760px);margin:26px auto 0;padding:0 56px 70px}
.page.wide+.backl,.wide-back{max-width:90%;padding-left:76px;padding-right:76px}
.backl h4{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--accent1);opacity:.8;margin:0 0 12px;font-weight:400;
}
.blitem{
  padding:11px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.015);transition:border-color .2s;
}
.blitem:hover{border-color:rgba(200,169,110,.35)}
.blitem b{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}
.blitem span{font-family:var(--font-editorial);font-size:16px;color:var(--muted)}

<script>
/* ============================================================
   página = {id, icon, title, parentId, blocks[], props{}, propOrder[],
             expanded, cover, created, updated}
   bloco  = {id, t, text, checked, icon}
   ============================================================ */
const KEY='rubrica:v3';
const BLOCK_TYPES=[
  ['p','Texto','Aa','parágrafo corrido'],
  ['h1','Título 1','H1','seção grande'],
  ['h2','Título 2','H2','seção média'],
  ['h3','Título 3','H3','subseção em itálico'],
  ['bullet','Lista','•','lista simples'],
  ['num','Lista numerada','1.','lista ordenada'],
  ['todo','Tarefa','☐','caixa de marcar'],
  ['quote','Citação','❝','destaque com barra'],
  ['callout','Aviso','◆','bloco em relevo'],
  ['code','Código','{}','texto monoespaçado'],
  ['divider','Divisor','—','fio dourado'],
  ['page','Subpágina','▤','cria uma página dentro desta'],
  ['table','Vista de tabela','▦','subpáginas em tabela'],
  ['board','Vista de quadro','▥','subpáginas em colunas'],
  ['gallery','Galeria','▩','subpáginas como cartões com capa']
];
const PROP_TYPES={texto:'≡',selecao:'⌄',numero:'#',data:'⌛'};
const PILL={ideia:'var(--muted)',rascunho:'var(--accent1)',revisar:'var(--accent5)',pronto:'var(--accent3)',
  protagonista:'var(--accent2)',antagonista:'var(--accent4)',secundario:'var(--accent6)'};
const ICONS=['✦','📖','✍️','🕯️','🗺️','🧭','👤','🌒','🏔️','🗝️','⚔️','🪶','🫀','🌫️','🔥','❄️','📄','🜁'];
const COVERS=[
  'linear-gradient(135deg,#1a1a27,#2a2140 55%,#3a2b4f)',
  'linear-gradient(135deg,#16161f,#2d2318 55%,#4a3a22)',
  'linear-gradient(135deg,#13131c,#152e2b 55%,#1d4740)',
  'linear-gradient(135deg,#1a1420,#3a1f2c 55%,#4f2436)',
  'linear-gradient(135deg,#0f1622,#152740 55%,#1c3a5c)'
];
/* configuração por página */
const CFG_DEF={modo:'herdar',largura:'normal',fonte:'editorial',tamanho:'normal',
  entrelinha:'normal',gap:'normal',recuo:'nenhum',travada:false};
const FONTE={editorial:'var(--font-editorial)',interface:'var(--font-ui)',maquina:'var(--font-mono)'};
const TAM={pequeno:'17px',normal:'20px',grande:'23px'};
const LH={compacto:'1.42',normal:'1.68',arejado:'1.98'};
const GAP={justo:'0px',normal:'2px',solto:'9px'};
const REC={nenhum:'0',medio:'1.6em',grande:'3em'};
const LARG={estreito:'620px',normal:'760px',largo:'980px',total:'90%'};
const MODO_NOME={full:'tela cheia',left:'lateral esq.',right:'lateral dir.',popup:'janela'};
function cfg(p,k){const c=p.cfg||{};return c[k]!==undefined?c[k]:CFG_DEF[k]}
function setCfg(p,k,v){p.cfg=p.cfg||{};p.cfg[k]=v;p.updated=Date.now()}
function styleOf(p){
  return '--ct-font:'+FONTE[cfg(p,'fonte')]+';--ct-size:'+TAM[cfg(p,'tamanho')]
    +';--ct-lh:'+LH[cfg(p,'entrelinha')]+';--blk-gap:'+GAP[cfg(p,'gap')]
    +';--ct-indent:'+REC[cfg(p,'recuo')]+';--page-w:'+LARG[cfg(p,'largura')];
}
function effMode(p){const m=cfg(p,'modo');return m==='herdar'?S.openMode:m}

let S=null,saveT=null,memOnly=false,menuEl=null,dragging=null,anim=null;
let pmenuEl=null,pmenuFresh=false,undoStack=[];

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const wc=t=>(String(t).match(/[\p{L}\p{N}'’-]+/gu)||[]).length;
const pageText=p=>p.blocks.map(b=>b.text||'').join('\n');
const pageWords=p=>wc(pageText(p));
const orfa=p=>p.parentId&&!S.pages[p.parentId];
const kids=id=>Object.values(S.pages).filter(p=>!p.trashed&&(p.parentId===id||(id===null&&orfa(p)))).sort((a,b)=>a.created-b.created);
const P=()=>S.pages[S.activeId];
const trashList=()=>Object.values(S.pages).filter(p=>p.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
function visible(id){
  let p=S.pages[id];
  if(!p)return false;
  while(p){if(p.trashed)return false;p=p.parentId?S.pages[p.parentId]:null}
  return true;
}
function trashPage(id){
  const now=Date.now();
  (function walk(pid){
    const pg=S.pages[pid];if(!pg||pg.trashed)return;
    pg.trashed=true;pg.trashedAt=now;
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>walk(c.id));
  })(id);
}
function restorePage(id){
  const target=S.pages[id];if(!target)return;
  (function down(pid){
    const pg=S.pages[pid];if(!pg||!pg.trashed)return;
    delete pg.trashed;delete pg.trashedAt;
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>down(c.id));
  })(id);
  let p=target;
  while(p&&p.parentId&&S.pages[p.parentId]){
    const anc=S.pages[p.parentId];
    if(anc.trashed){delete anc.trashed;delete anc.trashedAt}
    p=anc;
  }
}
function purgePage(id){
  (function rm(pid){
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>rm(c.id));
    delete S.pages[pid];
  })(id);
  if(S.peekId&&!S.pages[S.peekId])S.peekId=null;
  if(!S.pages[S.activeId]){
    S.activeId=Object.keys(S.pages)[0]||null;
    if(!S.activeId)seed();
  }
}

/* ---------------- armazenamento ----------------
   Grava dentro do estado do Sól de Sóter (window.SoterStorage), que sincroniza
   com o Firestore em users/{uid}/private/siteState. O localStorage continua
   sendo escrito como espelho local — é a base do desfazer e o que segura o
   trabalho quando a rede cai. Sem o app-shell, funciona só local. */
const DKEY='rubrica';
const temShell=()=>!!(window.SoterStorage&&typeof window.SoterStorage.getState==='function');
const espera=ms=>new Promise(r=>setTimeout(r,ms));

/* o app-shell carrega o SDK do Firebase de forma assíncrona; só faz sentido
   esperar por ele se a página realmente o incluiu */
const shellPrevisto=()=>!!document.querySelector('script[src*="app-shell"]');
async function esperaShell(limite){
  if(temShell())return true;
  if(!shellPrevisto())return false;
  const fim=Date.now()+(limite||2500);
  while(Date.now()<fim){if(temShell())return true;await espera(100)}
  return temShell();
}
/* espera o primeiro snapshot do Firestore, senão abriríamos com dados velhos */
async function esperaNuvem(limite){
  if(!temShell()||typeof window.SoterStorage.getFirebaseStatus!=='function')return;
  const fim=Date.now()+(limite||8000);
  while(Date.now()<fim){
    let st=null;
    try{st=await window.SoterStorage.getFirebaseStatus()}catch(e){return}
    if(!st||!st.configured)return;       /* sem firebase configurado */
    if(st.hydrated)return;               /* já trouxe o estado remoto */
    if(st.lastError)return;              /* falhou: segue com o local */
    await espera(150);
  }
}

async function load(){
  await esperaShell(2500);
  if(temShell()){
    await esperaNuvem(8000);
    try{
      const st=window.SoterStorage.getState();
      const d=st&&st.data?st.data[DKEY]:null;
      if(d&&d.pages&&Object.keys(d.pages).length)return d;
    }catch(e){}
    /* primeira vez na nuvem: adota o que existir só neste navegador */
    try{
      const legado=localStorage.getItem(KEY);
      if(legado){const j=JSON.parse(legado);if(j&&j.pages)return j}
    }catch(e){}
    return null;
  }
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return null;
}

function gravaNuvem(serial){
  if(!temShell())return;
  try{
    const st=window.SoterStorage.getState();
    if(!st.data||typeof st.data!=='object')st.data={};
    st.data[DKEY]=JSON.parse(serial);
    window.SoterStorage.save(st);
    nuvemErro=false;
  }catch(e){
    if(!nuvemErro){nuvemErro=true;toast('não consegui sincronizar com a nuvem — o texto está salvo neste aparelho')}
  }
}
let nuvemErro=false;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    const serial=JSON.stringify(S);
    try{
      const prev=localStorage.getItem(KEY);
      if(prev&&prev!==serial){undoStack.push(prev);if(undoStack.length>40)undoStack.shift()}
      localStorage.setItem(KEY,serial);
    }
    catch(e){if(!memOnly){memOnly=true;toast('sem gravação permanente aqui — exporte um backup ao terminar')}}
    gravaNuvem(serial);
  },500);
}

/* ao entrar na conta em outro aparelho, traz o que está na nuvem */
window.addEventListener('soter:firebase-auth-changed',async function(){
  if(!temShell())return;
  await esperaNuvem(8000);
  let d=null;
  try{const st=window.SoterStorage.getState();d=st&&st.data?st.data[DKEY]:null}catch(e){}
  if(!d||!d.pages||!Object.keys(d.pages).length)return;
  if(JSON.stringify(d)===JSON.stringify(S))return;
  if(document.querySelector('.ct:focus,[data-title]:focus'))return;   /* não interrompe quem escreve */
  S=d;
  if(!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0]||null;
  S.peekId=null;if(S.view==='graph'||S.view==='trash')S.view='page';
  render();toast('sincronizado com a sua conta');
});
function undo(){
  if(!undoStack.length){toast('nada para desfazer');return}
  const snap=undoStack.pop();
  let d=null;try{d=JSON.parse(snap)}catch(e){return}
  S=d;
  if(S.view==='graph')S.view='page';
  if(!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0]||null;
  render();
  const serial=JSON.stringify(S);
  try{localStorage.setItem(KEY,serial)}catch(e){}
  gravaNuvem(serial);
  toast('desfeito');
}

/* ---------------- markdown ---------------- */
function inline(t){
  let h=esc(t);
  h=h.replace(/\[\[([^\[\]\n]+)\]\]/g,(m,n)=>{
    const hit=findPage(n);
    return `<span class="wl${hit?'':' miss'}" data-wl="${esc(n)}">${esc(n)}</span>`;
  });
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<span class="md-b">$1</span>');
  h=h.replace(/(^|[\s(])_([^_\n]+)_/g,'$1<span class="md-i">$2</span>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<span class="md-i">$2</span>');
  h=h.replace(/~~([^~\n]+)~~/g,'<span class="md-s">$1</span>');
  h=h.replace(/`([^`\n]+)`/g,'<span class="md-c">$1</span>');
  h=h.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,'$1<span class="tg" data-tag="$2">#$2</span>');
  return h;
}
function findPage(name){const s=slug(name);return Object.values(S.pages).find(p=>slug(p.title)===s)||null}
function outLinks(p){
  const o=[];
  (pageText(p).match(/\[\[([^\[\]\n]+)\]\]/g)||[]).forEach(m=>{const n=m.slice(2,-2).trim();if(n&&!o.includes(n))o.push(n)});
  return o;
}
function backlinks(p){return Object.values(S.pages).filter(q=>q.id!==p.id&&outLinks(q).some(l=>slug(l)===slug(p.title)))}

function blockHTML(p,b,i,list){
  if(b.t==='divider')return `<div class="blk" data-t="divider" data-id="${b.id}">${gut(b.id)}<hr></div>`;
  if(b.t==='page'){
    const sub=S.pages[b.text];

  }

    return `<div class="blk" data-t="${b.t}" data-id="${b.id}">${gut(b.id)}<div class="dbwrap">${dbHTML(p,b)}</div></div>`;

  const ph=b.t==='p'?"digite / para blocos, [[ para ligar, + para criar página":

    b.t==='todo'?'tarefa':b.t==='callout'?'aviso':'escreva algo';

function blocksHTML(p){return `<div class="blocks" data-blocks>${p.blocks.map((b,i)=>blockHTML(p,b,i,p.blocks)).join('')}</div>`}

const GAL_FUNDO=[
  'linear-gradient(135deg,#1e1a2e,#332a4a)',
  'linear-gradient(135deg,#1c1a16,#3d3221)',
  'linear-gradient(135deg,#15201f,#1f3b36)',
  'linear-gradient(135deg,#231821,#472634)',
  'linear-gradient(135deg,#141c26,#1e3550)'
];
function galHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
/* prévia do corpo da página, para o cartão da galeria */
function resumo(p,n){
  const t=p.blocks.filter(b=>['p','quote','callout','h2','h3'].indexOf(b.t)>=0)
    .map(b=>b.text).filter(x=>x&&x.trim()).join(' ')
    .replace(/\[\[([^\[\]]+)\]\]/g,'$1').replace(/[*`~_#]/g,'').trim();
  return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+'…':t;
}
function dbHTML(p,b){
  const subs=kids(p.id);
  const mode=['table','board','gallery'].indexOf(b.t)>=0?b.t:'board';
  const keys=[...new Set(subs.reduce((a,s)=>a.concat(s.propOrder),[]))].slice(0,4);
  const tabs=`<div class="dbtabs">
    <button class="${mode==='table'?'on':''}" data-dbv="table" data-id="${b.id}">▦ tabela</button>
    <button class="${mode==='board'?'on':''}" data-dbv="board" data-id="${b.id}">▥ quadro</button>
    <button class="${mode==='gallery'?'on':''}" data-dbv="gallery" data-id="${b.id}">▩ galeria</button>
    <span style="flex:1"></span>
    ${mode==='gallery'?`<button data-galsize="${b.id}" title="Tamanho dos cartões">${{p:'▪',m:'▫',g:'▭'}[b.gs||'m']}</button>`:''}
    <button data-dbnew="${b.id}">+ nova</button></div>`;
  if(!subs.length)return tabs+`<div class="nada">nenhuma subpágina ainda — clique em “+ nova”</div>`;

  if(mode==='gallery'){
    const gs=b.gs||'m';
    return tabs+`<div class="gal ${gs}">${subs.map(s=>{
      const capa=s.cover||GAL_FUNDO[Math.abs(galHash(s.id))%GAL_FUNDO.length];
      const props=s.propOrder.filter(k=>(s.props[k]||{}).v).slice(0,2);
      const txt=resumo(s,gs==='p'?0:gs==='m'?90:190);
      return `<article class="gcard" data-card="${s.id}" data-page="${s.id}" draggable="true">
        <div class="gcap" style="background:${capa}"><span class="gico">${s.icon}</span></div>
        <div class="gbody">
          <b>${esc(s.title||'Sem título')}</b>
          ${txt?`<p>${esc(txt)}</p>`:''}
          <div class="gmeta">
            ${props.map(k=>{const val=s.props[k].v,c=PILL[slug(val)];
              return `<span class="pill" style="color:${c||'var(--muted)'}">${esc(val)}</span>`}).join('')}
            <span class="gw">${pageWords(s)}p</span>
            ${kids(s.id).length?`<span class="gw">▤ ${kids(s.id).length}</span>`:''}
          </div>
        </div>
      </article>`;
    }).join('')}
      <button class="gcard gnew" data-dbnew="${b.id}"><span>＋</span>nova página</button>
    </div>`;
  }

  if(mode==='table'){
    return tabs+`<table><thead><tr><th>Nome</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}<th>Palavras</th></tr></thead>
      <tbody>${subs.map(s=>`<tr>
        <td class="nm" data-page="${s.id}">${s.icon} ${esc(s.title||'Sem título')}</td>
        ${keys.map(k=>{const v=(s.props[k]||{}).v||'';const c=PILL[slug(v)];
          return `<td>${v?(c?`<span class="pill" style="color:${c}">${esc(v)}</span>`:esc(v)):'—'}</td>`}).join('')}
        <td>${pageWords(s)}</td></tr>`).join('')}</tbody></table>`;
  }
  const key=keys.indexOf('Status')>=0?'Status':(keys[0]||'Status');
  const vals=[...new Set(['ideia','rascunho','revisar','pronto'].concat(subs.map(s=>(s.props[key]||{}).v).filter(Boolean)))];
  return tabs+`<div class="board">${vals.map(v=>{
    const items=subs.filter(s=>slug((s.props[key]||{}).v||'')===slug(v));
    return `<div class="col"><h5>${esc(v)}<span style="opacity:.5">${items.length}</span></h5>
      <div class="drop" data-drop="${esc(v)}" data-key="${esc(key)}">
      ${items.map(s=>`<div class="card" draggable="true" data-card="${s.id}" data-page="${s.id}">
        <b>${s.icon} ${esc(s.title||'Sem título')}</b>
        <small>${pageWords(s)} palavras${(s.props.POV||{}).v?' · '+esc(s.props.POV.v):''}</small></div>`).join('')}
      </div></div>`;
  }).join('')}</div>`;
}

function backHTML(p){

  return `<div class="backl" data-back>

      return `<div class="blitem" ${t?`data-page="${t.id}"`:`data-create="${esc(l)}"`}><b>${t?t.icon+' '+esc(l):'＋ criar “'+esc(l)+'”'}</b></div>`}).join('')
      ||'<div class="nada">use [[ no texto para ligar páginas</div>'}</div>`;
}

function surfaceHTML(p){
  const wide=cfg(p,'largura')==='total';
  const trava=cfg(p,'travada');
  return `<div class="surface ${trava?'locked':''}" data-pid="${p.id}" style="${styleOf(p)}">
    ${p.cover?`<div class="cover" style="background:${p.cover}"><button class="swap" data-cover>trocar capa</button></div>`:''}

/* alvo de edição resolvido pelo DOM, não por variável global */
function hostOf(el){return el&&el.closest?el.closest('[data-pid]'):null}
function pageOf(el){const h=hostOf(el);return h?S.pages[h.dataset.pid]:null}
function refresh(host,what){
  if(!host||!host.dataset)return;
  const p=S.pages[host.dataset.pid];if(!p)return;
  const sel={blocks:'[data-blocks]',props:'[data-props]',back:'[data-back]'}[what];
  const el=host.querySelector(sel);if(!el)return;
  el.outerHTML={blocks:blocksHTML,props:propsHTML,back:backHTML}[what](p);
}
/* a mesma página pode estar aberta na área principal e no painel — mantém as duas iguais */
function syncOthers(host){
  if(!host)return;
  const id=host.dataset.pid;
  document.querySelectorAll('.surface[data-pid="'+id+'"]').forEach(o=>{
    if(o===host)return;
    if(o.contains(document.activeElement))return;
    refresh(o,'blocks');refresh(o,'props');refresh(o,'back');
  });
}
function rerenderBlock(host,id,caret){
  const p=S.pages[host.dataset.pid];
  const i=p.blocks.findIndex(b=>b.id===id);
  const old=host.querySelector('.blk[data-id="'+id+'"]');
  if(!old||i<0)return;
  const tmp=document.createElement('div');
  tmp.innerHTML=blockHTML(p,p.blocks[i],i,p.blocks);
  const nu=tmp.firstElementChild;
  old.replaceWith(nu);
  if(caret!=null){const ct=nu.querySelector('.ct');if(ct){ct.textContent=p.blocks[i].text;ct.focus();setCaret(ct,caret)}}
}
function focusBlock(host,id,pos){
  const ct=host.querySelector('.ct[data-b="'+id+'"]');if(!ct)return;
  const p=S.pages[host.dataset.pid],b=p.blocks.find(x=>x.id===id);
  if(b)ct.textContent=b.text;
  ct.focus();setCaret(ct,pos<0?ct.innerText.length:pos);
  ct.scrollIntoView({block:'nearest'});
}

/* ---------------- cursor ---------------- */
function getCaret(el){
  const s=window.getSelection();if(!s.rangeCount)return 0;
  const r=s.getRangeAt(0),pre=document.createRange();
  pre.selectNodeContents(el);
  try{pre.setEnd(r.endContainer,r.endOffset)}catch(e){return 0}
  return pre.toString().length;
}
function setCaret(el,pos){
  const r=document.createRange(),s=window.getSelection();
  let n=0,done=false;
  (function walk(node){
    if(done)return;
    if(node.nodeType===3){
      if(n+node.length>=pos){r.setStart(node,Math.max(0,pos-n));done=true}else n+=node.length;
    }else[].slice.call(node.childNodes).forEach(walk);
  })(el);
  if(!done){r.selectNodeContents(el);r.collapse(false)}else r.collapse(true);
  s.removeAllRanges();s.addRange(r);
}

/* ---------------- edição ---------------- */
const MD=[[/^# $/,'h1'],[/^## $/,'h2'],[/^### $/,'h3'],[/^[-*+] $/,'bullet'],[/^1[.)] $/,'num'],
  [/^\[ ?\] $/,'todo'],[/^> $/,'quote'],[/^```$/,'code'],[/^---$/,'divider'],[/^\| $/,'callout']];

document.addEventListener('input',e=>{
  const ct=e.target.closest&&e.target.closest('.ct');
  if(ct){
    const host=hostOf(ct),p=pageOf(ct);
    const b=p.blocks.find(x=>x.id===ct.dataset.b);if(!b)return;
    b.text=ct.innerText.replace(/\u00a0/g,' ');
    p.updated=Date.now();save();
    for(let k=0;k<MD.length;k++){
      if(MD[k][0].test(b.text)){
        const t=MD[k][1];b.text='';
        if(t==='divider'){b.t='divider';refresh(host,'blocks');addBlock(host,b.id,'p','',true)}
        else{b.t=t;rerenderBlock(host,b.id,0)}
        return;
      }
    }
    suggest(ct);return;
  }
  const ti=e.target.closest&&e.target.closest('[data-title]');
  if(ti){
    const p=pageOf(ti);p.title=ti.innerText.trim();p.updated=Date.now();
    save();renderTree();renderCrumb();
  }
});

document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'&&pmenuEl){e.preventDefault();closePMenu();return}
  if(mod&&e.key.toLowerCase()==='z'){
    const inEdit=e.target.closest&&e.target.closest('[contenteditable]');
    if(!inEdit){e.preventDefault();undo();return}
  }
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();return spotlight()}
  if(mod&&e.key.toLowerCase()==='g'){e.preventDefault();S.view=S.view==='graph'?'page':'graph';save();return render()}
  if(mod&&e.key==='.'){e.preventDefault();return document.body.classList.toggle('zen')}
  if(mod&&e.key==='\\'){e.preventDefault();return toggleSideCollapse()}
  if(mod&&(e.key===';'||e.key===':')){e.preventDefault();
    if(S.peekId){S.cfgPeek=!S.cfgPeek;save();renderPeek()}
    else{S.cfgOpen=!S.cfgOpen;save();renderCfg()}
    return;}
  if(e.key==='Escape'&&S.peekId&&!menuEl){S.peekId=null;save();renderPeek();renderTree();return}
  if(menuEl&&['ArrowDown','ArrowUp','Enter','Escape','Tab'].indexOf(e.key)>=0)return menuKeys(e);

  const ct=e.target.closest&&e.target.closest('.ct');
  if(!ct)return;
  const host=hostOf(ct),p=pageOf(ct);
  const id=ct.dataset.b,i=p.blocks.findIndex(b=>b.id===id),b=p.blocks[i];
  if(!b)return;
  const caret=getCaret(ct),len=ct.innerText.length;

  if(mod&&e.key.toLowerCase()==='b'){e.preventDefault();return wrapSel(host,ct,b,'**')}
  if(mod&&e.key.toLowerCase()==='i'){e.preventDefault();return wrapSel(host,ct,b,'*')}

  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    if(b.t==='code'){document.execCommand('insertText',false,'\n');return}
    if(['bullet','num','todo','quote'].indexOf(b.t)>=0&&!b.text.trim()){
      b.t='p';rerenderBlock(host,b.id,0);save();return;
    }
    const rest=b.text.slice(caret);
    b.text=b.text.slice(0,caret);
    const cont=['bullet','num','todo'].indexOf(b.t)>=0?b.t:'p';
    const nb=mkBlock(cont,rest);
    p.blocks.splice(i+1,0,nb);
    refresh(host,'blocks');focusBlock(host,nb.id,0);save();return;
  }
  if(e.key==='Backspace'&&caret===0&&!window.getSelection().toString()){
    if(b.t!=='p'){e.preventDefault();b.t='p';b.checked=false;rerenderBlock(host,b.id,0);save();return}
    if(i>0){
      e.preventDefault();
      const prev=p.blocks[i-1];
      if(['divider','page','table','board','gallery'].indexOf(prev.t)>=0){
        p.blocks.splice(i-1,1);refresh(host,'blocks');focusBlock(host,b.id,0);save();return;
      }
      const pos=prev.text.length;
      prev.text+=b.text;p.blocks.splice(i,1);
      refresh(host,'blocks');focusBlock(host,prev.id,pos);save();return;
    }
  }
  if(e.key==='ArrowUp'&&caret===0&&i>0){e.preventDefault();focusBlock(host,p.blocks[i-1].id,-1)}
  if(e.key==='ArrowDown'&&caret===len&&i<p.blocks.length-1){e.preventDefault();focusBlock(host,p.blocks[i+1].id,0)}
});

function wrapSel(host,ct,b,mark){
  const s=window.getSelection();if(!s.rangeCount||!s.toString())return;
  const z=getCaret(ct),a=z-s.toString().length;
  b.text=b.text.slice(0,a)+mark+b.text.slice(a,z)+mark+b.text.slice(z);
  rerenderBlock(host,b.id,z+mark.length*2);save();
}
function addBlock(host,afterId,t,text,focus){
  const p=S.pages[host.dataset.pid];
  const i=p.blocks.findIndex(b=>b.id===afterId);
  const nb=mkBlock(t,text);
  p.blocks.splice(i+1,0,nb);refresh(host,'blocks');save();
  if(focus)focusBlock(host,nb.id,0);
  return nb;
}
function setType(host,id,t){
  const p=S.pages[host.dataset.pid],b=p.blocks.find(x=>x.id===id);if(!b)return;
  if(t==='page'){
    const sub=mkPage('Sem título',p.id,'📄');
    p.expanded=true;b.t='page';b.text=sub;refresh(host,'blocks');renderTree();save();return;
  }
  b.t=t;refresh(host,'blocks');save();
  if(['table','board','gallery','divider','page'].indexOf(t)<0)focusBlock(host,id,0);
}

/* ---------------- menus ---------------- */
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}}
let menuItems=[],menuSel=0,menuTitle='',menuFresh=false;
function openMenu(x,y,items,title){
  closeMenu();
  menuItems=items;menuSel=0;menuTitle=title||'';
  /* o clique que abriu este menu ainda vai subir até o document,
     onde há um "fechar menus" — este sinal impede o auto-fechamento */
  menuFresh=true;setTimeout(()=>{menuFresh=false},0);
  menuEl=document.createElement('div');
  menuEl.className='menu';
  menuEl.style.left=Math.max(8,Math.min(x,window.innerWidth-272))+'px';
  menuEl.style.top=Math.max(8,Math.min(y,window.innerHeight-350))+'px';
  paintMenu();
  menuEl.addEventListener('mousedown',ev=>{
    const b=ev.target.closest('button[data-i]');if(!b)return;
    ev.preventDefault();const it=menuItems[+b.dataset.i];closeMenu();it.run();
  });
  document.body.appendChild(menuEl);
}
function paintMenu(){
  menuEl.innerHTML=(menuTitle?'<div class="grp">'+esc(menuTitle)+'</div>':'')+menuItems.map((it,i)=>
    `<button data-i="${i}" class="${i===menuSel?'sel':''} ${it.act?'act':''}">
      ${it.ic?'<span class="ic">'+it.ic+'</span>':''}
      <span>${esc(it.label)}${it.sub?'<small>'+esc(it.sub)+'</small>':''}</span></button>`).join('');
}
function menuKeys(e){
  if(e.key==='Escape'){e.preventDefault();popOff=popKey;return closeMenu()}
  if(e.key==='ArrowDown'){e.preventDefault();menuSel=(menuSel+1)%menuItems.length;paintMenu()}
  if(e.key==='ArrowUp'){e.preventDefault();menuSel=(menuSel-1+menuItems.length)%menuItems.length;paintMenu()}
  if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();const it=menuItems[menuSel];closeMenu();it&&it.run()}
}

/* ---------------- menu de opções da página (botão ⋯) ---------------- */
function closePMenu(){if(pmenuEl){pmenuEl.remove();pmenuEl=null}}
function openPageMenu(anchorEl,p){
  closePMenu();closeMenu();
  pmenuFresh=true;setTimeout(()=>{pmenuFresh=false},0);
  const r=anchorEl.getBoundingClientRect();
  pmenuEl=document.createElement('div');
  pmenuEl.className='menu pmenu';
  pmenuEl.style.left=Math.max(8,Math.min(r.right-280,window.innerWidth-288))+'px';
  pmenuEl.style.top=Math.max(8,Math.min(r.bottom+6,window.innerHeight-460))+'px';
  pmenuEl.innerHTML=`<div class="pmenu-search"><span class="pms-ic">⌕</span><input id="pmSearch" placeholder="Pesquisar ações…" autocomplete="off"></div>
    <div class="pmenu-scroll" id="pmBody"></div>
    <div class="pmenu-foot" id="pmFoot"></div>`;
  pmenuEl.addEventListener('click',e=>e.stopPropagation());
  document.body.appendChild(pmenuEl);
  const inp=pmenuEl.querySelector('#pmSearch');
  inp.oninput=()=>renderPMBody(p,inp.value);
  inp.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closePMenu()}};

  inp.focus();
}
function pmActions(p){

    {id:'content',label:'Copiar conteúdo da página',ic:'📄',run:()=>pmCopyContent(p)},

    {id:'move',label:'Mover para',ic:'→',run:el=>pmOpenMoveMenu(el,p)},

    {id:'small',label:'Texto pequeno',ic:'A↓',toggle:cfg(p,'tamanho')==='pequeno',stay:true,run:()=>pmToggleCfg(p,'tamanho','pequeno','normal')},
    {id:'wide',label:'Largura completa',ic:'↔',toggle:cfg(p,'largura')==='total',stay:true,run:()=>pmToggleCfg(p,'largura','total','normal')},
    {id:'custom',label:'Personalizar página',ic:'⚙',chevron:true,run:()=>pmOpenCustomize(p)},
    {id:'lock',label:'Bloquear página',ic:'🔒',toggle:cfg(p,'travada'),stay:true,run:()=>pmToggleLock(p)},
    {id:'undo',label:'Desfazer',ic:'↺',kbd:'Ctrl Z',run:()=>undo()},
    {id:'import',label:'Importar',ic:'↥',run:()=>pmImport(p)},
    {id:'export',label:'Exportar',ic:'↧',run:()=>{download((p.title||'pagina')+'.md',toMD(p),'text/markdown');toast('página exportada')}}
  ];
}
function pmRow(a){
  if(!a)return'';
  const right=a.toggle!==undefined?`<span class="pmtoggle ${a.toggle?'on':''}"></span>`
    :a.chevron?'<span class="pmchev">›</span>'
    :a.kbd?`<span class="pmkbd">${a.kbd}</span>`:'';
  return `<button class="pmenu-item ${a.danger?'danger':''}" data-pmact="${a.id}">
    <span class="ic">${a.ic}</span><span class="lbl">${esc(a.label)}</span>${right}</button>`;
}
function renderPMBody(p,query){
  if(!pmenuEl)return;
  const body=pmenuEl.querySelector('#pmBody'),foot=pmenuEl.querySelector('#pmFoot');
  const s=slug(query||'');
  const acts=pmActions(p);
  if(!s){
    const fontRow=`<div class="pmenu-fonts">${[
      ['interface','Padrão','var(--font-ui)'],['editorial','Serifada','var(--font-editorial)'],['maquina','Mono','var(--font-mono)']
    ].map(f=>`<button data-pmfont="${f[0]}" class="${cfg(p,'fonte')===f[0]?'on':''}"><span style="font-family:${f[2]}">Ag</span><small>${f[1]}</small></button>`).join('')}</div>`;
    const groups=[['link','content','dup','move','trash'],['small','wide','custom','lock'],['undo'],['import','export']];
    body.innerHTML=fontRow+groups.map(g=>'<div class="pmenu-div"></div>'+g.map(id=>pmRow(acts.find(a=>a.id===id))).join('')).join('');
    const n=pageWords(p);
    foot.style.display='';
    foot.innerHTML=`Contagem de palavras: ${n} palavra${n===1?'':'s'}<br>Editado em ${new Date(p.updated||p.created).toLocaleString('pt-BR')}`;
  }else{
    const filtered=acts.filter(a=>slug(a.label).indexOf(s)>=0);
    body.innerHTML=filtered.length?filtered.map(pmRow).join(''):'<div class="nada" style="padding:14px">nada encontrado</div>';
    foot.style.display='none';
  }
  body.querySelectorAll('[data-pmfont]').forEach(b=>b.onclick=()=>{
    setCfg(p,'fonte',b.dataset.pmfont);save();render();renderPMBody(p,query);
  });
  body.querySelectorAll('[data-pmact]').forEach(b=>b.onclick=()=>{
    const a=acts.find(x=>x.id===b.dataset.pmact);if(!a)return;
    a.run(b);
    if(a.stay)renderPMBody(p,query);else closePMenu();
  });
}
function pmCopyLink(p){
  const url=location.origin+location.pathname+'#p='+p.id;
  const done=()=>toast('link copiado');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done).catch(done);
  else done();
}
function pmCopyContent(p){
  const txt=toMD(p);
  const done=()=>toast('conteúdo copiado');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(done);
  else done();
}
function pmDuplicate(p){
  const id=mkPage(p.title+' (cópia)',p.parentId,p.icon);
  S.pages[id].blocks=p.blocks.map(b=>Object.assign({},b,{id:uid()}));
  S.pages[id].props=JSON.parse(JSON.stringify(p.props));
  S.pages[id].propOrder=p.propOrder.slice();
  S.pages[id].cover=p.cover;
  if(p.cfg)S.pages[id].cfg=Object.assign({},p.cfg);
  save();go(id);
}
function descendantIds(id){
  const out=new Set();
  (function walk(pid){Object.values(S.pages).forEach(c=>{if(c.parentId===pid&&!out.has(c.id)){out.add(c.id);walk(c.id)}})})(id);
  return out;
}
function pmOpenMoveMenu(anchorEl,p){
  closePMenu();
  const excl=descendantIds(p.id);excl.add(p.id);
  const r=anchorEl.getBoundingClientRect();
  const items=[{label:'Nível superior (sem página-mãe)',ic:'▤',act:!p.parentId,run:()=>pmMoveTo(p,null)}]
    .concat(Object.values(S.pages).filter(pp=>!excl.has(pp.id)&&!pp.trashed)
      .sort((a,b)=>(a.title||'').localeCompare(b.title||''))
      .map(pp=>({label:pp.title||'Sem título',ic:pp.icon,act:p.parentId===pp.id,run:()=>pmMoveTo(p,pp.id)})));
  openMenu(r.left,r.bottom+6,items,'Mover para');
}
function pmMoveTo(p,newParentId){
  p.parentId=newParentId;p.updated=Date.now();
  const par=newParentId?S.pages[newParentId]:null;if(par)par.expanded=true;
  save();render();toast('página movida');
}
function trashWithFallback(p){
  trashPage(p.id);
  if(S.peekId&&!visible(S.peekId))S.peekId=null;
  if(!visible(S.activeId)){
    let altId=null;
    if(p.parentId&&visible(p.parentId))altId=p.parentId;
    else{const found=Object.values(S.pages).find(pp=>visible(pp.id));if(found)altId=found.id;}
    S.activeId=altId||mkPage('',null,'📄');
  }
  save();render();
}
function pmTrash(p){
  if(!confirm('Mover "'+(p.title||'Sem título')+'" e suas subpáginas para a lixeira?'))return;
  trashWithFallback(p);
  toast('movida para a lixeira');
}
function pmToggleCfg(p,key,onVal,offVal){
  setCfg(p,key,cfg(p,key)===onVal?offVal:onVal);
  save();render();
}
function pmToggleLock(p){
  setCfg(p,'travada',!cfg(p,'travada'));
  save();render();
}
function pmOpenCustomize(p){
  if(S.peekId===p.id){S.cfgPeek=true;save();renderPeek()}
  else{S.cfgOpen=true;save();renderCfg()}
}
function pmImport(p){
  const i=document.createElement('input');i.type='file';i.accept='.md,.txt';
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const lines=String(rd.result).split(/\r?\n/);
      const blocks=[];
      lines.forEach(line=>{
        if(!line.trim())return;
        let m;
        if(m=line.match(/^### (.*)/))blocks.push(mkBlock('h3',m[1]));
        else if(m=line.match(/^## (.*)/))blocks.push(mkBlock('h2',m[1]));
        else if(m=line.match(/^# (.*)/))blocks.push(mkBlock('h1',m[1]));
        else if(m=line.match(/^[-*] (.*)/))blocks.push(mkBlock('bullet',m[1]));
        else if(m=line.match(/^\d+[.)] (.*)/))blocks.push(mkBlock('num',m[1]));
        else if(m=line.match(/^> (.*)/))blocks.push(mkBlock('quote',m[1]));
        else if(line.trim()==='---')blocks.push(mkBlock('divider'));
        else blocks.push(mkBlock('p',line));
      });
      if(!blocks.length){toast('nada para importar');return}
      if(p.blocks.length===1&&!p.blocks[0].text)p.blocks=blocks;
      else p.blocks=p.blocks.concat(blocks);
      p.updated=Date.now();save();
      const host=document.querySelector('.surface[data-pid="'+p.id+'"]');
      if(host)refresh(host,'blocks');else render();
      toast(blocks.length+' blocos importados');
    };
    rd.readAsText(f);
  };
  i.click();
}

let popKey=null,popOff=null;
function suggest(ct){
  const host=hostOf(ct),p=pageOf(ct);
  const b=p.blocks.find(x=>x.id===ct.dataset.b);if(!b)return closeMenu();
  const c=getCaret(ct),upto=b.text.slice(0,c);
  const link=upto.match(/\[\[([^\[\]\n]*)$/);
  const cmd=upto.match(/(?:^|\s)\/([\p{L}]*)$/u);
  const plus=upto.match(/(?:^|\s)\+([\p{L}\p{N}][\p{L}\p{N} ’'\-]{0,38})$/u);
  const gat=link?'[':cmd?'/':plus?'+':null;
  if(!gat){popKey=popOff=null;return closeMenu()}
  popKey=b.id+gat+(c-(link||cmd||plus)[1].length);
  if(popOff===popKey)return closeMenu();
  const sel=window.getSelection();
  let x=0,y=0;
  if(sel.rangeCount){const r=sel.getRangeAt(0).getBoundingClientRect();x=r.left;y=r.bottom+8}
  if(!x){const r=ct.getBoundingClientRect();x=r.left;y=r.bottom+8}

  if(link){
    const q=slug(link[1]);
    const items=Object.values(S.pages).filter(pp=>pp.id!==p.id&&slug(pp.title).indexOf(q)>=0).slice(0,6)
      .map(pp=>({label:pp.title||'Sem título',ic:pp.icon,sub:'ligar',run:()=>completeLink(host,ct,b,link[1],pp.title)}));
    if(link[1].trim())items.push({label:'Criar “'+link[1].trim()+'”',ic:'＋',sub:'nova página já ligada',
      run:()=>completeLink(host,ct,b,link[1],link[1].trim(),true)});
    if(!items.length)return closeMenu();
    return openMenu(x,y,items,'Ligar a uma página');
  }
  if(plus){
    const title=plus[1].trim();
    if(!title)return closeMenu();
    const ja=findPage(title);
    const items=ja&&ja.id!==p.id
      ? [{label:'Ligar a “'+ja.title+'”',ic:ja.icon,sub:'esta página já existe',
          run:()=>fromPlus(host,ct,b,plus[1],false)},
         {label:'Abrir “'+ja.title+'”',ic:'⤢',sub:'ligar e abrir',
          run:()=>fromPlus(host,ct,b,plus[1],true)}]
      : [{label:'Criar “'+title+'”',ic:'＋',sub:'página filha de '+(p.title||'Sem título'),
          run:()=>fromPlus(host,ct,b,plus[1],false)},
         {label:'Criar e abrir “'+title+'”',ic:'⤢',sub:'cria e já entra na página',
          run:()=>fromPlus(host,ct,b,plus[1],true)}];
    return openMenu(x,y,items,'Nova página aqui dentro');
  }
  if(cmd){
    const q=slug(cmd[1]);
    const items=BLOCK_TYPES.filter(t=>slug(t[1]).indexOf(q)>=0)
      .map(t=>({label:t[1],ic:t[2],sub:t[3],run:()=>{
        const cc=getCaret(ct);
        b.text=b.text.slice(0,cc-cmd[1].length-1)+b.text.slice(cc);
        setType(host,b.id,t[0]);
      }}));
    if(!items.length)return closeMenu();
    return openMenu(x,y,items,'Blocos');
  }
  closeMenu();
}
/* +texto → cria (ou liga) uma página filha da página onde se está escrevendo */
function fromPlus(host,ct,b,typed,abrir){
  const p=S.pages[host.dataset.pid];
  const title=typed.trim();
  if(!title)return;
  const c=getCaret(ct);
  const ini=c-typed.length-1;                    /* posição do próprio "+" */
  const soZinho=!b.text.slice(0,ini).trim()&&!b.text.slice(c).trim();
  const ja=findPage(title);
  const id=(ja&&ja.id!==p.id)?ja.id:mkPage(title,p.id,'📄');
  p.expanded=true;

  if(soZinho){
    b.t='page';b.text=id;
    refresh(host,'blocks');
    addBlock(host,b.id,'p','',true);             /* linha em branco para seguir escrevendo */
  }else{
    b.text=b.text.slice(0,ini)+'[['+title+']]'+b.text.slice(c);
    rerenderBlock(host,b.id,ini+title.length+4);
  }
  refresh(host,'back');renderTree();save();
  toast(ja?'ligada a “'+title+'”':'“'+title+'” criada dentro de '+(p.title||'Sem título'));
  if(abrir)openPage(id,true);
}
function completeLink(host,ct,b,typed,title,create){
  const p=S.pages[host.dataset.pid];
  const c=getCaret(ct);
  b.text=b.text.slice(0,c-typed.length-2)+'[['+title+']]'+b.text.slice(c);
  const pos=c-typed.length-2+title.length+4;
  if(create&&!findPage(title)){mkPage(title,p.id,'📄');p.expanded=true;renderTree()}
  rerenderBlock(host,b.id,pos);refresh(host,'back');save();
}

/* ---------------- navegação e exibição ---------------- */
function go(id){
  if(!S.pages[id])return;
  S.activeId=id;S.view='page';S.peekId=null;S.peekMode=null;
  let p=S.pages[id];while(p.parentId&&S.pages[p.parentId]){p=S.pages[p.parentId];p.expanded=true}
  document.body.classList.remove('show-side');
  try{history.replaceState(null,'',location.pathname+'#p='+id)}catch(e){}
  save();render();$('#scroll').scrollTop=0;
}
function openPage(id,fromLink){
  if(!S.pages[id])return;
  const m=effMode(S.pages[id]);
  if(!fromLink||m==='full')return go(id);
  S.peekId=id;S.peekMode=m;save();renderPeek();renderTree();
}
/* ---------------- cliques ---------------- */
document.addEventListener('mousedown',e=>{
  const wl=e.target.closest&&e.target.closest('.wl');
  if(wl){
    e.preventDefault();
    const t=findPage(wl.dataset.wl);
    if(t)openPage(t.id,true);
    else{const p=pageOf(wl);const id=mkPage(wl.dataset.wl,p?p.id:null,'📄');if(p)p.expanded=true;openPage(id,true)}
  }
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.menu')&&!menuFresh)closeMenu();
  if(pmenuEl&&!t.closest('.pmenu')&&!pmenuFresh)closePMenu();

  if(t.closest('[data-restore]')){const id=t.closest('[data-restore]').dataset.restore;restorePage(id);save();render();toast('página restaurada');return}
  if(t.closest('[data-purge]')){
    const id=t.closest('[data-purge]').dataset.purge,pg=S.pages[id];
    if(!pg)return;
    if(!confirm('Excluir definitivamente "'+(pg.title||'Sem título')+'"? Essa ação não pode ser desfeita.'))return;
    purgePage(id);save();render();toast('excluída definitivamente');return;
  }
  if(t.closest('[data-trashclear]')){
    const list=trashList();if(!list.length)return;
    if(!confirm('Excluir definitivamente todos os itens da lixeira?'))return;
    list.forEach(p=>purgePage(p.id));save();render();toast('lixeira esvaziada');return;
  }

  if(t.closest('[data-closepeek]')){S.peekId=null;save();renderPeek();renderTree();return}
  if(t.closest('[data-peekfull]')){const id=S.peekId;S.peekId=null;return go(id)}
  if(t.closest('[data-peekmore]')){
    const p=S.pages[S.peekId];
    if(p)openPageMenu(t.closest('[data-peekmore]'),p);
    return;
  }
  if(t.closest('[data-opencfg]')){
    const h=hostOf(t);
    if(h&&S.peekId===h.dataset.pid){S.cfgPeek=!S.cfgPeek;save();renderPeek()}
    else{S.cfgOpen=!S.cfgOpen;save();renderCfg()}
    return;
  }

  const holder=t.closest('[data-cfgpid]');
  if(holder){
    const pc=S.pages[holder.dataset.cfgpid];
    const cb=t.closest('[data-cfg]');
    if(cb){
      const v=cb.dataset.val;
      setCfg(pc,cb.dataset.cfg,v==='true'?true:(v==='false'?false:v));
      save();render();return;
    }
    if(t.closest('[data-cfgreset]')){
      if(!confirm('Restaurar todos os padrões desta página?'))return;
      delete pc.cfg;save();render();return;
    }
    if(t.closest('[data-cfgcover]')){
      pc.cover=pc.cover?COVERS[(COVERS.indexOf(pc.cover)+1)%COVERS.length]:COVERS[0];
      save();render();return;
    }
    if(t.closest('[data-cfgdup]')){
      const id=mkPage(pc.title+' (cópia)',pc.parentId,pc.icon);
      S.pages[id].blocks=pc.blocks.map(b=>Object.assign({},b,{id:uid()}));
      S.pages[id].props=JSON.parse(JSON.stringify(pc.props));
      S.pages[id].propOrder=pc.propOrder.slice();
      S.pages[id].cover=pc.cover;
      if(pc.cfg)S.pages[id].cfg=Object.assign({},pc.cfg);
      save();return go(id);
    }
    if(t.closest('[data-cfgexport]')){
      download((pc.title||'pagina')+'.md',toMD(pc),'text/markdown');
      toast('página exportada');return;
    }
    if(t.closest('[data-cfgdel]')){
      if(!confirm('Excluir “'+(pc.title||'Sem título')+'” e suas subpáginas?'))return;
      (function rm(id){kids(id).forEach(c=>rm(c.id));delete S.pages[id]})(pc.id);
      if(S.peekId&&!S.pages[S.peekId])S.peekId=null;
      if(!S.pages[S.activeId])S.activeId=(pc.parentId&&S.pages[pc.parentId])?pc.parentId:Object.keys(S.pages)[0]||null;
      if(!S.activeId)seed();
      save();render();return;
    }
    if(t.closest('[data-cfgicon]')){
      const r=t.closest('[data-cfgicon]').getBoundingClientRect();
      return openMenu(r.left-140,r.bottom+8,ICONS.map(ic=>({label:ic,ic,act:pc.icon===ic,
        run:()=>{pc.icon=ic;save();render()}})),'Ícone da página');
    }
  }

  const tw=t.closest('[data-tw]');
  if(tw&&!tw.classList.contains('leaf')){
    e.stopPropagation();
    const p=S.pages[tw.dataset.tw];p.expanded=!p.expanded;save();return renderTree();
  }
  const addsub=t.closest('[data-addsub]');
  if(addsub){
    e.stopPropagation();
    const parent=S.pages[addsub.dataset.addsub];parent.expanded=true;
    return go(mkPage('',parent.id,'📄'));
  }
  const trashrow=t.closest('[data-trashrow]');
  if(trashrow){
    e.stopPropagation();
    const pg=S.pages[trashrow.dataset.trashrow];
    if(pg&&confirm('Mover "'+(pg.title||'Sem título')+'" e suas subpáginas para a lixeira?')){
      trashWithFallback(pg);
      toast('movida para a lixeira');
    }
    return;
  }

  const host=hostOf(t);
  if(host){
    const p=S.pages[host.dataset.pid];
    const chk=t.closest('[data-check]');
    if(chk){const b=p.blocks.find(x=>x.id===chk.dataset.check);b.checked=!b.checked;refresh(host,'blocks');save();return}
    const plus=t.closest('[data-plus]');
    if(plus)return addBlock(host,plus.dataset.plus,'p','',true);
    const drag=t.closest('[data-drag]');
    if(drag){
      const id=drag.dataset.drag,r=drag.getBoundingClientRect();
      return openMenu(r.left,r.bottom+8,
        BLOCK_TYPES.filter(x=>['page','table','board','gallery'].indexOf(x[0])<0)
          .map(x=>({label:'virar '+x[1].toLowerCase(),ic:x[2],run:()=>setType(host,id,x[0])}))
        .concat([
          {label:'duplicar',ic:'⧉',run:()=>{const i=p.blocks.findIndex(b=>b.id===id);
            p.blocks.splice(i+1,0,Object.assign({},p.blocks[i],{id:uid()}));refresh(host,'blocks');save()}},
          {label:'excluir',ic:'✕',run:()=>{p.blocks=p.blocks.filter(b=>b.id!==id);
            if(!p.blocks.length)p.blocks=[mkBlock()];refresh(host,'blocks');save()}}
        ]),'Bloco');
    }
    const gsz=t.closest('[data-galsize]');
    if(gsz){
      const b=p.blocks.find(x=>x.id===gsz.dataset.galsize);
      b.gs={p:'m',m:'g',g:'p'}[b.gs||'m'];
      refresh(host,'blocks');save();return;
    }
    const dbv=t.closest('[data-dbv]');
    if(dbv){const b=p.blocks.find(x=>x.id===dbv.dataset.id);b.t=dbv.dataset.dbv;refresh(host,'blocks');save();return}
    const dbn=t.closest('[data-dbnew]');
    if(dbn){
      const bg=p.blocks.find(x=>x.id===dbn.dataset.dbnew);
      const galeria=bg&&bg.t==='gallery';
      const id=mkPage('Sem título',p.id,'📄');
      S.pages[id].propOrder=['Status'];S.pages[id].props={Status:{type:'selecao',v:'ideia'}};
      if(galeria){
        S.pages[id].cfg={modo:'popup'};
        S.pages[id].cover=GAL_FUNDO[Math.abs(galHash(id))%GAL_FUNDO.length];
      }
      p.expanded=true;save();return openPage(id,true);
    }
    if(t.closest('[data-pico]')||t.closest('[data-icon]')){
      const r=(t.closest('[data-pico]')||t.closest('[data-icon]')).getBoundingClientRect();
      return openMenu(r.left,r.bottom+8,ICONS.map(ic=>({label:ic,ic,act:p.icon===ic,
        run:()=>{p.icon=ic;save();render()}})),'Ícone da página');
    }

          p.propOrder=p.propOrder.map(x=>x===k?n:x);p.props[n]=p.props[k];delete p.props[k];save();refresh(host,'props')}}
      ].concat(['ideia','rascunho','revisar','pronto'].map(v=>({label:'definir: '+v,ic:'●',
          run:()=>{p.props[k]={type:'selecao',v};save();refresh(host,'props')}})),
        [{label:'remover propriedade',ic:'✕',run:()=>{
          p.propOrder=p.propOrder.filter(x=>x!==k);delete p.props[k];save();refresh(host,'props')}}]),k);
    }
  }

  const tag=t.closest('[data-tag]');
  if(tag)return spotlight('#'+tag.dataset.tag);
  const cr=t.closest('[data-create]');
  if(cr){const p=pageOf(cr);const id=mkPage(cr.dataset.create,p?p.id:null,'📄');if(p)p.expanded=true;return openPage(id,true)}

/* o bloco mostra markdown renderizado quando não está em foco; ao entrar nele,
   converte a posição visível para a posição no texto cru (senão o cursor pula) */
const MARCAS=['**','~~','[[',']]'];
function rawOffset(raw,vis){
  let i=0,v=0;
  while(i<raw.length&&v<vis){
    let pulou=false;
    for(let k=0;k<MARCAS.length;k++){
      if(raw.substr(i,2)===MARCAS[k]){i+=2;pulou=true;break}
    }
    if(pulou)continue;
    const c=raw[i];
    if(c==='*'||c==='`'||(c==='_'&&(i===0||/\s|\(/.test(raw[i-1])))){i++;continue}
    i++;v++;
  }
  return i;
}
document.addEventListener('focusin',e=>{
  const ct=e.target.closest&&e.target.closest('.ct');
  if(ct){
    const p=pageOf(ct),b=p&&p.blocks.find(x=>x.id===ct.dataset.b);
    if(b&&ct.textContent!==b.text){
      const vis=getCaret(ct);
      ct.textContent=b.text;
      setCaret(ct,Math.min(rawOffset(b.text,vis),b.text.length));
    }
  }
});

/* ---------------- grafo ---------------- */
function renderGraph(sc){
  sc.innerHTML=`<div class="gwrap"><canvas id="graph"></canvas>
    <div class="gctl">
      <h6>Constelação</h6>
      <label>ligações [[ ]]<input type="checkbox" id="gl" ${S.graphLinks?'checked':''}></label>
      <label>hierarquia<input type="checkbox" id="gh" ${S.graphHier?'checked':''}></label>
      <label>distância<input type="range" id="gf" min="50" max="240" value="120"></label>
      <div class="leg">
        <span><i style="background:#c8a96e"></i>página ligada</span>
        <span><i style="background:#5ec4a8"></i>página atual</span>
        <span><i style="background:#7a7590"></i>sem ligação</span>
      </div>
    </div></div>`;

  const cv=$('#graph'),ctx=cv.getContext('2d'),wrap=cv.parentElement;
  const dpr=window.devicePixelRatio||1;
  const fit=()=>{cv.width=wrap.clientWidth*dpr;cv.height=wrap.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();window.addEventListener('resize',fit);

  const list=Object.values(S.pages);
  const N=list.map((p,i)=>({id:p.id,t:p.title||'Sem título',deg:0,
    r:5+Math.min(11,Math.sqrt(pageWords(p))/2.5),
    x:wrap.clientWidth/2+Math.cos(i*2.4)*(110+i*5),
    y:wrap.clientHeight/2+Math.sin(i*2.4)*(110+i*5),vx:0,vy:0}));
  const ix={};N.forEach((n,i)=>ix[n.id]=i);
  let E=[];
  const rebuild=()=>{
    E=[];N.forEach(n=>n.deg=0);
    list.forEach(p=>{
      if(S.graphLinks)outLinks(p).forEach(l=>{const t=findPage(l);
        if(t&&ix[t.id]!=null){E.push([ix[p.id],ix[t.id],1]);N[ix[p.id]].deg++;N[ix[t.id]].deg++}});
      if(S.graphHier&&p.parentId&&ix[p.parentId]!=null){
        E.push([ix[p.parentId],ix[p.id],0]);N[ix[p.id]].deg++;N[ix[p.parentId]].deg++}
    });
  };
  rebuild();
  $('#gl').onchange=e=>{S.graphLinks=e.target.checked;save();rebuild()};
  $('#gh').onchange=e=>{S.graphHier=e.target.checked;save();rebuild()};
  let dist=120;$('#gf').oninput=e=>dist=+e.target.value;

  let cam={x:0,y:0,z:1},drag=null,pan=null,hover=null;
  const toW=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left-cam.x)/cam.z,y:(e.clientY-b.top-cam.y)/cam.z}};
  const pick=p=>N.filter(n=>Math.hypot(n.x-p.x,n.y-p.y)<n.r+9)[0];
  cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.3,Math.min(3,cam.z*(e.deltaY<0?1.12:.89)))},{passive:false});
  cv.addEventListener('mousedown',e=>{const p=toW(e),n=pick(p);
    if(n)drag={n,dx:n.x-p.x,dy:n.y-p.y,moved:false};else pan={x:e.clientX-cam.x,y:e.clientY-cam.y}});
  cv.addEventListener('mousemove',e=>{const p=toW(e);hover=pick(p);
    cv.style.cursor=hover?'pointer':(pan?'grabbing':'grab');
    if(drag){drag.n.x=p.x+drag.dx;drag.n.y=p.y+drag.dy;drag.n.vx=drag.n.vy=0;drag.moved=true}
    if(pan){cam.x=e.clientX-pan.x;cam.y=e.clientY-pan.y}});
  window.addEventListener('mouseup',()=>{if(drag&&!drag.moved)openPage(drag.n.id,true);drag=null;pan=null});

  function step(){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      const a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy||.01;
      if(d2>140000)continue;
      const d=Math.sqrt(d2),f=1600/d2;
      a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f;
    }
    E.forEach(ed=>{const a=N[ed[0]],b=N[ed[1]],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;
      const f=(d-dist)*.009;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;
    N.forEach(n=>{n.vx+=(cx-n.x)*.0018;n.vy+=(cy-n.y)*.0018;n.vx*=.85;n.vy*=.85;
      if(!drag||drag.n!==n){n.x+=n.vx;n.y+=n.vy}});
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z);
    E.forEach(ed=>{const a=N[ed[0]],b=N[ed[1]];
      ctx.strokeStyle=ed[2]?'rgba(200,169,110,.42)':'rgba(124,111,205,.3)';
      ctx.lineWidth=ed[2]?1:1.2;
      ctx.setLineDash(ed[2]?[]:[3,5]);
      ctx.globalAlpha=(hover&&hover!==a&&hover!==b)?.18:1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
    ctx.setLineDash([]);ctx.globalAlpha=1;
    N.forEach(n=>{
      const on=hover===n||n.id===S.activeId;
      const col=n.id===S.activeId?'#5ec4a8':(n.deg?'#c8a96e':'#7a7590');
      ctx.globalAlpha=hover&&!on?.4:1;
      if(on){ctx.shadowColor=col;ctx.shadowBlur=18}
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.shadowBlur=0;
      if(cam.z>.55||on){
        ctx.fillStyle=on?'#e8e4f0':'rgba(232,228,240,.62)';
        ctx.font=(on?'600 ':'')+'12px Syne,sans-serif';ctx.textAlign='center';
        ctx.fillText(n.t.length>24?n.t.slice(0,22)+'…':n.t,n.x,n.y+n.r+15);
      }
      ctx.globalAlpha=1});
    ctx.restore();
  }
  (function loop(){step();draw();anim=requestAnimationFrame(loop)})();
}

/* ---------------- busca ---------------- */
function spotlight(pre){
  pre=pre||'';
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="spot"><input id="sq" placeholder="buscar páginas, texto ou #marcações…" value="'+esc(pre)+'"><div class="res" id="sr"></div></div>';
  document.body.appendChild(ov);
  let items=[],sel=0;
  const cmds=[
    {label:'Nova página',ic:'＋',kind:'ação',run:()=>go(mkPage('',S.activeId,'📄'))},
    {label:'Abrir o grafo',ic:'✦',kind:'ação',run:()=>{S.view='graph';save();render()}},
    {label:'Exportar Markdown',ic:'↧',kind:'ação',run:exportMD}
  ];
  const build=q=>{
    const s=slug(q);
    const pages=Object.values(S.pages)
      .filter(p=>slug(p.title).indexOf(s)>=0||(s.length>2&&slug(pageText(p)).indexOf(s)>=0))
      .slice(0,8)
      .map(p=>({label:p.title||'Sem título',ic:p.icon,
        kind:p.parentId&&S.pages[p.parentId]?'em '+(S.pages[p.parentId].title||'…'):'raiz',run:()=>go(p.id)}));
    items=q?pages.concat(cmds.filter(c=>slug(c.label).indexOf(s)>=0))
      :cmds.concat(Object.values(S.pages).slice(0,6).map(p=>({label:p.title||'Sem título',ic:p.icon,kind:'',run:()=>go(p.id)})));
    sel=0;paint();
  };
  const paint=()=>{$('#sr').innerHTML=items.map((it,i)=>
    '<button data-i="'+i+'" class="'+(i===sel?'sel':'')+'"><span>'+(it.ic||'📄')+'</span>'+esc(it.label)+'<small>'+esc(it.kind||'')+'</small></button>').join('')
    ||'<div class="nada" style="padding:14px">enter cria uma página com esse nome</div>'};
  const close=()=>ov.remove();
  const inp=$('#sq');inp.focus();inp.select();
  inp.oninput=e=>build(e.target.value);
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(1,items.length);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+items.length)%Math.max(1,items.length);paint()}
    else if(e.key==='Enter'){e.preventDefault();
      if(items[sel])items[sel].run();else if(e.target.value.trim())go(mkPage(e.target.value.trim(),null,'📄'));
      close()}
    else if(e.key==='Escape')close();
  };
  $('#sr').onclick=e=>{const b=e.target.closest('button[data-i]');if(b){items[+b.dataset.i].run();close()}};
  ov.onclick=e=>{if(e.target===ov)close()};
  build(pre);
}

/* ---------------- exportar ---------------- */
function toMD(p,depth){
  depth=depth||0;
  const props=p.propOrder.filter(k=>p.props[k]&&p.props[k].v).map(k=>k+': '+p.props[k].v).join('\n');
  let out='---\ntitulo: '+p.title+'\n'+props+'\n---\n\n'+'#'.repeat(Math.min(6,depth+1))+' '+p.title+'\n\n';
  let n=0;
  p.blocks.forEach(b=>{
    if(b.t==='num')n++;else n=0;
    const map={p:b.text,h1:'# '+b.text,h2:'## '+b.text,h3:'### '+b.text,
      bullet:'- '+b.text,num:n+'. '+b.text,todo:'- ['+(b.checked?'x':' ')+'] '+b.text,
      quote:'> '+b.text,code:'```\n'+b.text+'\n```',callout:'> '+(b.icon||'✦')+' '+b.text,
      divider:'---',page:'',table:'',board:'',gallery:''};
    const line=map[b.t]!==undefined?map[b.t]:b.text;
    if(line!=='')out+=line+'\n\n';
  });
  kids(p.id).forEach(c=>out+=toMD(c,depth+1));
  return out;
}
function download(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportMD(){
  const txt=Object.values(S.pages).filter(p=>!p.parentId||orfa(p)).map(p=>toMD(p)).join('\n\n');
  download('rubrica.md',txt,'text/markdown');toast('markdown exportado');
}

(function(){
  const cv=document.getElementById('bg-canvas');if(!cv||!cv.getContext)return;
  let ctx=null;
  try{ctx=cv.getContext('2d')}catch(e){}
  if(!ctx){cv.style.display='none';return}   /* sem canvas, o app segue sem o céu */
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,stars=[],shoots=[];
  const HUE={white:[220,215,255],gold:[200,169,110],violet:[140,120,210],sky:[120,190,240]};
  const rand=(a,b)=>a+Math.random()*(b-a);
  function init(){
    W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    stars=[];
    const count=reduce?90:200;
    for(let i=0;i<count;i++){
      const layer=Math.floor(Math.random()*3);
      stars.push({x:rand(0,W),y:rand(0,H),vx:rand(-.04,.04)*(layer+1),vy:rand(-.02,.03)*(layer+1),
        r:rand(.3,1.2)*(layer*.4+.6),alpha:rand(.25,.9),ts:rand(.004,.02),
        td:Math.random()>.5?1:-1,
        hue:Math.random()<.16?(Math.random()<.5?'gold':(Math.random()<.5?'violet':'sky')):'white'});
    }
  }
  function nebula(cx,cy,r,color){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2);
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    nebula(W*.16,H*.24,Math.max(W,H)*.45,'rgba(124,111,205,.055)');
    nebula(W*.84,H*.78,Math.max(W,H)*.4,'rgba(200,169,110,.038)');
    stars.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;
      if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
      s.alpha+=s.ts*s.td;
      if(s.alpha>.95||s.alpha<.22)s.td*=-1;
      const c=HUE[s.hue];
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);
      ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+s.alpha.toFixed(2)+')';ctx.fill();
    });
    for(let i=shoots.length-1;i>=0;i--){
      const sh=shoots[i];
      const dx=Math.cos(sh.angle)*sh.len,dy=Math.sin(sh.angle)*sh.len;
      const g=ctx.createLinearGradient(sh.x,sh.y,sh.x-dx,sh.y-dy);
      g.addColorStop(0,'rgba(232,228,240,'+sh.alpha.toFixed(2)+')');
      g.addColorStop(1,'rgba(232,228,240,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-dx,sh.y-dy);ctx.stroke();
      sh.x-=Math.cos(sh.angle)*sh.speed;sh.y+=Math.sin(sh.angle)*sh.speed*-1+sh.speed*.6;
      sh.alpha-=.012;
      if(sh.alpha<=0)shoots.splice(i,1);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',init);
  try{init();frame()}catch(e){cv.style.display='none'}
  if(!reduce)setInterval(()=>{
    if(document.hidden)return;
    shoots.push({x:rand(W*.3,W),y:rand(0,H*.35),len:rand(90,180),
      angle:rand(20,45)*Math.PI/180,speed:rand(7,13),alpha:1});
  },7000);
})();

})();
